<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wefly 前端演示 · 单文件</title>
  <style>:root {
  --ui-bg: #f8fafc;
  --ui-bg-elevated: #ffffff;
  --ui-border: #e2e8f0;
  --ui-text: #0f172a;
  --ui-text-muted: #64748b;
  --ui-primary: #2563eb;
  --sidebar-w: 15rem;
  --font: "Public Sans", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
html.dark {
  --ui-bg: #020617;
  --ui-bg-elevated: #0f172a;
  --ui-border: #334155;
  --ui-text: #f1f5f9;
  --ui-text-muted: #94a3b8;
  --ui-primary: #3b82f6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; height: 100dvh; font-family: var(--font); font-size: 14px; color: var(--ui-text); background: var(--ui-bg); overflow: hidden; }
.shell { display: flex; height: 100vh; height: 100dvh; min-height: 0; position: relative; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
.mobile-nav-btn,
.sidebar-backdrop { display: none; }
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
  background: var(--ui-bg-elevated);
  border-right: 1px solid var(--ui-border);
  min-height: 0;
}
.sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 0 4px; }
.brand { display: flex; align-items: center; gap: 8px; cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: #fff; font-weight: 800; font-size: 12px;
  display: grid; place-items: center;
}
.brand-name { font-size: 20px; font-weight: 700; }
.head-actions { display: flex; gap: 4px; }
.icon-btn {
  width: 32px; height: 32px; border: 1px solid var(--ui-border);
  border-radius: 8px; background: transparent; cursor: pointer; color: var(--ui-text-muted);
  display: grid; place-items: center; font-size: 14px;
}
.icon-btn:hover { background: rgba(0,0,0,.04); color: var(--ui-text); }
html.dark .icon-btn:hover { background: rgba(255,255,255,.06); }
.btn-primary {
  width: 100%; border: none; border-radius: 10px; padding: 10px 14px;
  background: rgba(37,99,235,.12); color: var(--ui-primary);
  font-weight: 600; font-size: 13px; cursor: pointer; margin-bottom: 12px;
}
.btn-primary:hover { background: rgba(37,99,235,.18); }
.nav-block { margin-top: 12px; }
.nav-entry {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  gap: 8px; border: none; border-radius: 10px; padding: 10px 12px;
  background: rgba(100,116,139,.08); cursor: pointer; font: inherit; color: inherit; text-align: left;
}
.nav-entry:hover { background: rgba(100,116,139,.14); }
.nav-entry.on { box-shadow: inset 0 0 0 1px rgba(37,99,235,.25); }
.nav-entry-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.nav-entry-left span:last-child { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-hint { font-size: 11px; color: var(--ui-text-muted); line-height: 1.4; margin: 6px 4px 0; }
.history {
  flex: 1; min-height: 0; overflow-y: auto;
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--ui-border);
}
.history-label { font-size: 11px; font-weight: 600; color: var(--ui-text-muted); padding: 8px 8px 4px; text-transform: uppercase; letter-spacing: .04em; }
.history-item {
  display: block; width: 100%; border: none; background: none;
  text-align: left; padding: 8px 10px; border-radius: 8px;
  font-size: 13px; color: var(--ui-text); cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.history-item:hover { background: rgba(0,0,0,.04); }
html.dark .history-item:hover { background: rgba(255,255,255,.06); }
.history-item.on { background: rgba(37,99,235,.12); color: var(--ui-primary); font-weight: 600; }
.sidebar-foot {
  flex-shrink: 0; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--ui-border);
  display: flex; align-items: center; gap: 10px; padding-left: 4px;
}
.avatar {
  width: 32px; height: 32px; border-radius: 999px;
  background: #6366f1; color: #fff; font-size: 13px; font-weight: 700;
  display: grid; place-items: center; flex-shrink: 0;
}
.user-name { font-size: 13px; font-weight: 600; }
.user-role { font-size: 11px; color: var(--ui-text-muted); }
.main-wrap {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  margin: 16px 16px 16px 0; border-radius: 12px;
  box-shadow: inset 0 0 0 1px var(--ui-border);
  background: rgba(255,255,255,.75); overflow: hidden;
}
html.dark .main-wrap { background: rgba(15,23,42,.75); }
.main-frame { flex: 1; width: 100%; border: none; min-height: 0; background: var(--ui-bg-elevated); }
.demo-badge {
  position: fixed; bottom: 12px; right: 12px; z-index: 99;
  background: rgba(15,23,42,.85); color: #fff; font-size: 11px;
  padding: 6px 10px; border-radius: 8px; pointer-events: none;
}
.hidden { display: none !important; }
@media (max-width: 900px) {
  .mobile-nav-btn {
    display: grid;
    place-items: center;
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 200;
    width: 40px;
    height: 40px;
    border: 1px solid var(--ui-border);
    border-radius: 10px;
    background: var(--ui-bg-elevated);
    color: var(--ui-text);
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 140;
    background: rgba(15,23,42,.35);
  }
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    z-index: 150;
    width: min(var(--sidebar-w), 88vw);
    max-width: 280px;
    transform: translateX(-105%);
    transition: transform .25s ease;
    box-shadow: 8px 0 24px rgba(0,0,0,.12);
  }
  .shell.sidebar-open .sidebar { transform: translateX(0); }
  .shell.sidebar-open .sidebar-backdrop { display: block; }
  .main-wrap {
    margin: 0;
    border-radius: 0;
    box-shadow: none;
    min-height: 0;
    height: 100%;
  }
  .nav-hint { display: none; }
  .demo-badge { bottom: 8px; right: 8px; left: 8px; font-size: 10px; text-align: center; }
}
@media (max-width: 768px) {
  .btn-primary { font-size: 13px; }
  .history-item { font-size: 12px; }
}</style>
</head>

  const bytes = new Uint8Array(bin.length);

  const html = new TextDecoder('utf-8').decode(bytes);
  pageCache[b64] = html;
  return html;
}
function loadFramePage(key) {
  const html = decodePage(WEFLY_PAGES[key] || WEFLY_PAGES.chat);
  frame.removeAttribute('src');
  frame.srcdoc = html;
}
function parseHash() {
  const h = (location.hash || '#/chat').replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  route = parts[0] || 'chat';
  routeParam = parts.slice(1).join('/') || '';
}
function groupsFrom(items) {
  const map = new Map();
  items.forEach(it => { if (!map.has(it.group)) map.set(it.group, []); map.get(it.group).push(it); });
  return map;
}
function renderHistory() {
  historyEl.innerHTML = '';
  groupsFrom(CHAT_SESSIONS).forEach((list, label) => {
    const lbl = document.createElement('div');
    lbl.className = 'history-label'; lbl.textContent = label;
    historyEl.appendChild(lbl);
    list.forEach(it => {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'history-item';
      btn.textContent = it.label; btn.title = it.label;
      if (route === 'chat' && routeParam === it.id) btn.classList.add('on');
      btn.onclick = () => navigate('chat/' + it.id);
      historyEl.appendChild(btn);
    });
  });
}
function resolvePageKey() {
  if (route === 'chat') return 'chat';
  if (route === 'agents' && !routeParam) return 'agents-hub';
  if (route === 'agents' && AGENT_KEYS[routeParam]) return AGENT_KEYS[routeParam];
  if (route === 'agents') return 'agents-hub';
  return 'chat';
}
function syncThemeToFrame() { try { frame.contentWindow.postMessage({ type: 'wefly-theme', dark }, '*'); } catch (e) {} }
function syncToolConfigToFrame() {
  if (resolvePageKey() !== 'agent:creative') return;
  try { frame.contentWindow.postMessage({ type: 'wefly-tool-config', entry: 'image', drawer: '0', agentName: '素材制作 Agent' }, '*'); } catch (e) {}
}
function syncSessionToFrame() {
  if (route !== 'chat') return;
  try { frame.contentWindow.postMessage({ type: 'wefly-session', sessionId: routeParam || '' }, '*'); } catch (e) {}
}
function updateNavState() {
  navAgents.classList.toggle('on', route === 'agents');
  renderHistory();
}
function navigate(path) {
  document.querySelector('.shell')?.classList.remove('sidebar-open');
  location.hash = '#/' + path;
}
function applyRoute() {
  parseHash();
  updateNavState();
  const key = resolvePageKey();
  const changed = key !== currentPageKey;
  if (changed) {
    currentPageKey = key;
    loadFramePage(key);
  }
  document.documentElement.classList.toggle('dark', dark);
  if (!changed) {
    syncThemeToFrame();
    syncSessionToFrame();
    syncToolConfigToFrame();
  }
}
(function(){
  window.addEventListener('message',ev=>{
    var d=ev.data;if(!d||typeof d!=='object')return;
    if(d.type==='wefly-asset-ingest'){try{frame.contentWindow.postMessage({type:'wefly-asset-synced',source:d.source,pool:d.pool,assets:d.assets||[]},'*');}catch(e){}}
    if(d.type==='wefly-yuanjing-handoff'){try{console.info('[demo] 元境外链已打开',d.handoffId);}catch(e){}}
  });
})();
frame.addEventListener('load', () => { syncThemeToFrame(); syncSessionToFrame(); syncToolConfigToFrame(); });
window.addEventListener('hashchange', applyRoute);
window.addEventListener('message', e => { if (e.data?.type === 'wefly-nav') navigate(e.data.route); });
document.getElementById('brand').onclick = () => navigate('chat');
document.getElementById('themeBtn').onclick = () => {
  dark = !dark;
  try { localStorage.setItem('wefly-demo-dark', dark ? '1' : '0'); } catch (e) {}
  applyRoute();
};
document.getElementById('newBtn').onclick = () => navigate('chat');
navAgents.onclick = () => navigate('agents');
document.getElementById('mobileNavBtn')?.addEventListener('click', () => {
  document.querySelector('.shell')?.classList.toggle('sidebar-open');
});
document.getElementById('sidebarBackdrop')?.addEventListener('click', () => {
  document.querySelector('.shell')?.classList.remove('sidebar-open');
});
if (!location.hash) location.hash = '#/chat';
applyRoute();</script>
