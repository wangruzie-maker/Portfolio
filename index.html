<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wang Ruize · Portfolio</title>
  <meta name="description" content="王瑞泽 — AI 产品 · 市场增长 · Agent 工具" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#corridor">跳到正文</a>

  <div class="atmosphere" aria-hidden="true">
    <div class="atmosphere__wash"></div>
    <div class="atmosphere__damask" id="damask"></div>
    <div class="atmosphere__grain"></div>
    <div class="atmosphere__orb"></div>
  </div>

  <div class="app">
    <aside class="rail" aria-label="主导航">
      <button class="brand" type="button" data-go="home" title="Home">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text">
          <b data-edit-text="nameZh">王瑞泽</b>
          <em>PORTFOLIO</em>
        </span>
      </button>

      <p class="rail__label">Navigate</p>
      <nav class="rail__nav" id="mainNav">
        <button type="button" class="rail__item is-active" data-go="home"><span class="ico" data-i="home"></span>Home</button>
        <button type="button" class="rail__item" data-go="journey"><span class="ico" data-i="journey"></span>Journey</button>
        <button type="button" class="rail__item" data-go="lab"><span class="ico" data-i="lab"></span>Lab</button>
        <button type="button" class="rail__item" data-go="work"><span class="ico" data-i="work"></span>Work</button>
      </nav>

      <div class="rail__tail">
        <p class="rail__label">Contact</p>
        <a class="rail__contact" href="mailto:wangruzie@gmail.com" data-edit-text="email">wangruzie@gmail.com</a>
        <a class="rail__contact" href="tel:15315189380" data-edit-text="phone">15315189380</a>
        <p class="rail__hint">← → 或点导航切换模块</p>
      </div>
    </aside>

    <div class="main">
      <header class="top">
        <div class="top__left">
          <span class="top__title" id="pageTitle">Home</span>
          <div class="trail" id="trail" aria-label="位置"></div>
        </div>
        <div class="top__nav" aria-label="模块切换">
          <button type="button" class="icon-btn" id="prevMod" aria-label="上一个">‹</button>
          <button type="button" class="icon-btn" id="nextMod" aria-label="下一个">›</button>
        </div>
        <div class="top__right">
          <button type="button" class="ghost-btn" id="editBtn" hidden title="需密码解锁">编辑</button>
          <span class="top__status" data-edit-text="status">开放全职机会</span>
        </div>
      </header>

      <div class="route-loader" id="routeLoader" hidden aria-hidden="true">
        <span></span><span></span><span></span>
      </div>

      <div class="strip" id="corridor" tabindex="0">
        <section class="pane" data-route="home" id="pane-home"></section>
        <section class="pane" data-route="journey" id="pane-journey"></section>
        <section class="pane" data-route="lab" id="pane-lab"></section>
        <section class="pane" data-route="work" id="pane-work"></section>
        <section class="pane" data-route="works" id="pane-works"></section>
        <section class="pane" data-route="baidu" id="pane-baidu"></section>
        <section class="pane" data-route="quwan" id="pane-quwan"></section>
        <section class="pane" data-route="iflytek" id="pane-iflytek"></section>
        <section class="pane" data-route="zixun" id="pane-zixun"></section>
        <section class="pane" data-route="tool-wefly" id="pane-tool-wefly"></section>
        <section class="pane" data-route="tool-xingzhen" id="pane-tool-xingzhen"></section>
        <section class="pane" data-route="tool-topic-ai" id="pane-tool-topic-ai"></section>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="content.js"></script>
  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
